<!DOCTYPE html>
<html lang="pt-BR">
<!-- index.html — Página base (HTML). O React desenha todo o conteúdo dentro de <div id="root">. Neste arquivo os comentários usam o formato próprio do HTML. -->
<head>
  <!-- Acentos em português. -->
  <meta charset="utf-8" />
  <!-- Essencial para responsividade: faz o site se ajustar à largura do celular/tablet; viewport-fit=cover usa a tela toda em aparelhos com notch. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Título da aba do navegador. -->
  <title>Cozinha da Tere</title>
  <!-- Fontes do Google: Fraunces (títulos) e Work Sans (textos). -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Aqui entra o aplicativo React. -->
  <div id="root"></div>
  <!-- Carrega o código do app (src/main.jsx). -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
